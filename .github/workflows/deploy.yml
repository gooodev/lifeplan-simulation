name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json の packageManager は Vite+ 独自のオブジェクト形式
      # （{name, version, onFail}）で、pnpm/action-setup が読める標準の
      # "pnpm@x.y.z" 形式ではないため、バージョンをここで明示する。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # src/routeTree.gen.ts は TanStack Router の Vite プラグインが
      # ビルド時に生成する（gitignore対象で、フレッシュな checkout には存在しない）。
      # `vp check`（静的なtscベースの型チェック）はこのファイルが無いと
      # ルート引数の型を解決できず失敗するため、必ずビルドを先に走らせる。
      - name: Build (SPA, base path = /${{ github.event.repository.name }}/)
        run: pnpm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - run: pnpm exec vp check

      # `vp test`（引数なし）は watch モードで起動し続けるため、CI では
      # 一度だけ実行して終了する `vp test run` を明示的に呼ぶ。
      - run: pnpm exec vp test run

      # GitHub Pages はサーバー側のルーティングを持たないため、直接アクセス・
      # リロードされた深いURLも index.html を返すようにして SPA 側の
      # クライアントルーティングに解決させる。
      - name: SPA fallback for direct/deep links
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
